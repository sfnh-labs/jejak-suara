# Organisations: the seed for the `organizations` table (jejak/organizations.py).
#
# Every office on a figure's CV names an organisation in free text
# (positions[].org). Each run links that text to one row here, by its name,
# short name or an alias, so "DPR", "DPR RI" and "Dewan Perwakilan Rakyat"
# are one datapoint. The curator keeps the list in /kurasi/organisasi; this
# file only adds what is missing and fills an empty short name, kind or alias
# list, so an edit there is never undone from here.
#
# kind: kementerian | lembaga | parlemen | pemerintah | kabinet | partai |
#       aparat | bumn | swasta | ormas | kampus | media | olahraga |
#       internasional | lainnya
#
# Left out on purpose (an office's "org" that is not an organisation, or is
# ambiguous): Dapil …, Pemilu 2024, "Terpilih kembali pada Pilkada 2024",
# "Pelaksana tugas sejak 2014", Florida, Varanasi, Kalimantan Tengah,
# Bidang …, Formula E Jakarta 2022, The Apprentice, "Pramono Anung–Rano Karno",
# "Komisi IV" (of which body?), PBB (Perserikatan Bangsa-Bangsa or Partai
# Bulan Bintang?). They stay unlinked and come up for review.

